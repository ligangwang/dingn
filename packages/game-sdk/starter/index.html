<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p id="target" hidden></p>
      <button id="tap" type="button" disabled>Tap</button>
      <p id="score">Points: 0</p>
      <p id="best">Best: 0</p>
      <p id="outcome" role="status" hidden></p>
      <button id="start" type="button">Start</button>
      <button id="challenge" type="button" hidden></button>
      <div id="share" hidden>
        <input id="link" type="url" readonly aria-label="Challenge link" />
        <button id="copy" type="button"></button>
      </div>
      <p id="status" role="status"></p>
      <button id="signin" type="button" hidden></button>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
