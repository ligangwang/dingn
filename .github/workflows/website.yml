name: Website

# One workflow deploys both the website and the games: Google Cloud only
# accepts deploys from this workflow. Each part runs only when its files
# change, so changing a game publishes it without redeploying the website.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game:
        description: Game id (folder under games/). Leave empty to redeploy the website.
        required: false
      action:
        description: What to do with that game
        type: choice
        options: [publish, publish-beta, set-live, set-beta, list, unlist]
        default: publish
      version:
        description: Version for set-live or set-beta (a rollback is set-live with an older version)
        required: false
      migration:
        description: One-time data migration to run instead (dry-run only counts)
        type: choice
        options: [none, crowd-progress-dry-run, crowd-progress, badge-xp-dry-run, badge-xp]
        default: none

permissions:
  contents: read

jobs:
  changes:
    name: Find changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.find.outputs.site }}
      games: ${{ steps.find.outputs.games }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_GAME: ${{ inputs.game }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          all_games() { for d in games/*/; do [ -f "$d/game.json" ] && basename "$d"; done; }
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$MIGRATION" ] && [ "$MIGRATION" != none ]; then
            site=false; games=""
          elif [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$INPUT_GAME" ]; then site=false; games="$INPUT_GAME"; else site=true; games=""; fi
          else
            from="${BASE:-$BEFORE}"
            if [ -z "$from" ] || ! files=$(git diff --name-only "$from" HEAD 2>/dev/null); then
              files=$(git ls-files)
            fi
            site=false
            echo "$files" | grep -qvE '^(games/|docs/)' && site=true
            # The SDK, the publisher and this workflow affect every game;
            # publishing skips versions that are already published.
            if echo "$files" | grep -qE '^(packages/game-sdk/|scripts/publish-game.mjs|scripts/game-registry.mjs|\.github/workflows/website.yml)'; then
              games=$(all_games)
            else
              games=$(echo "$files" | grep '^games/' | cut -d/ -f2 | sort -u | while read -r id; do [ -f "games/$id/game.json" ] && echo "$id"; done)
            fi
          fi
          games=$(echo $games)
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "games=$games" >> "$GITHUB_OUTPUT"
          echo "Website: $site. Games: ${games:-none}"

  validate:
    name: Validate website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Firestore security rules
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-dingn-feedback "node --test tests/feedback-rules.test.mjs tests/billing-rules.test.mjs"

  deploy:
    name: Deploy Cloud Run
    needs: [changes, validate]
    if: needs.changes.outputs.site == 'true' && github.repository == 'ligangwang/dingn' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dingn-cloud-run-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: dingn-193716
      REGION: us-central1
      SERVICE: dingn-web
      IMAGE: us-central1-docker.pkg.dev/dingn-193716/dingn-web/website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production container
        run: docker build --tag "$IMAGE:$GITHUB_SHA" .
      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: dingn-193716
          workload_identity_provider: projects/211238433635/locations/global/workloadIdentityPools/dingn-github/providers/github
          service_account: dingn-github-deploy@dingn-193716.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      # Rules go live before the code that depends on them (for example the
      # server-only `rewards` coins), and a failure stops the deploy. The
      # deploy account needs roles/firebaserules.admin (docs/game-platform.md).
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@15.35.0 deploy --only firestore:rules --project "$PROJECT" --non-interactive
      - name: Push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy immutable image
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          gcloud run deploy "$SERVICE" \
            --image "$digest" --project "$PROJECT" --region "$REGION" \
            --service-account "dingn-web-runtime@$PROJECT.iam.gserviceaccount.com" \
            --port 8080 --memory 512Mi --cpu 1 --min-instances 0 --max-instances 2 \
            --timeout 60 --quiet
          gcloud run services update-traffic "$SERVICE" --to-latest \
            --project "$PROJECT" --region "$REGION" --quiet
      - name: Check deployed website
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          for path in / /sitemap.xml /robots.txt /signin/ /account/ /word/ /number/ /card/ /feedback/ /admin/feedback/ /logic/ /decisions/ /opt-out/ /memory-ladder/ /zh/ /zh/word/ /play/crowdrush/ /zh/play/crowdrush/ /zh/memory-ladder/ /play/hello/ /api/games/hello /g/hello/1.0.0/index.html /developers/ /developers/agreement/ /developers/playground/ /developers/games/ /sdk/v1/dingn-sdk.js /sdk/v1/starter.zip /health /__/auth/handler; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$url$path" --output /dev/null
          done
          # Games load the SDK from other origins, which needs this header.
          headers=$(curl --fail --silent --show-error --head "$url/sdk/v1/dingn-sdk.js")
          grep -i '^access-control-allow-origin: \*' <<<"$headers" > /dev/null
          printf 'Deployed commit `%s` to [dingn](%s).\n' "$GITHUB_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"

  games:
    name: Publish games
    needs: changes
    if: needs.changes.outputs.games != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dingn-games-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GAMES_BUCKET: dingn-193716-games
      FIREBASE_PROJECT_ID: dingn-193716
      IDS: ${{ needs.changes.outputs.games }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.repository == 'ligangwang/dingn' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and check (no upload)
        if: env.PUBLISH != 'true'
        run: |
          for id in $IDS; do
            GAMES_LOCAL_DIR="$RUNNER_TEMP/games" npm run publish:game -- "$id" --dry-run
          done
      - name: Authenticate with GitHub OIDC
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: dingn-193716
          workload_identity_provider: projects/211238433635/locations/global/workloadIdentityPools/dingn-github/providers/github
          service_account: dingn-github-deploy@dingn-193716.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: env.PUBLISH == 'true'
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          ACTION: ${{ inputs.action || 'publish' }}
          VERSION: ${{ inputs.version }}
        run: |
          for id in $IDS; do
            case "$ACTION" in
              publish) npm run publish:game -- "$id" --if-new ;;
              publish-beta) npm run publish:game -- "$id" --beta ;;
              set-live) npm run publish:game -- "$id" --set-live "$VERSION" ;;
              set-beta) npm run publish:game -- "$id" --set-beta "$VERSION" ;;
              list) npm run publish:game -- "$id" --listed ;;
              unlist) npm run publish:game -- "$id" --unlisted ;;
            esac
            printf -- '- `%s`: %s %s\n' "$id" "$ACTION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done

  migrate:
    name: Migrate data
    if: github.event_name == 'workflow_dispatch' && inputs.migration != 'none' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: dingn-193716
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: dingn-193716
          workload_identity_provider: projects/211238433635/locations/global/workloadIdentityPools/dingn-github/providers/github
          service_account: dingn-github-deploy@dingn-193716.iam.gserviceaccount.com
      - name: Move Crowd Rush progress to crowdrush
        if: startsWith(inputs.migration, 'crowd-progress')
        run: |
          set -o pipefail
          if [ "${{ inputs.migration }}" = crowd-progress ]; then apply=--apply; else apply=; fi
          node scripts/migrate-crowd-progress.mjs $apply | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pay XP for badges earned before badges gave XP
        if: startsWith(inputs.migration, 'badge-xp')
        run: |
          set -o pipefail
          if [ "${{ inputs.migration }}" = badge-xp ]; then apply=--apply; else apply=; fi
          node scripts/backfill-badge-xp.mjs $apply | tee -a "$GITHUB_STEP_SUMMARY"
