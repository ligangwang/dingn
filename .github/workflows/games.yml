name: Games

# Publishes games to the game platform without deploying the website.
# - A push to main that changes games/<id>/ publishes that game, if its
#   game.json version is new (otherwise it is skipped).
# - Run it by hand to release a beta, or to roll back: Actions → Games →
#   Run workflow.
on:
  pull_request:
    branches: [main]
    paths: ['games/**', 'packages/game-sdk/**', 'scripts/publish-game.mjs', 'scripts/game-registry.mjs']
  push:
    branches: [main]
    paths: ['games/**', 'packages/game-sdk/**']
  workflow_dispatch:
    inputs:
      game:
        description: Game id (the folder name under games/)
        required: true
      action:
        description: What to do
        type: choice
        options: [publish, publish-beta, set-live, set-beta, list, unlist]
        default: publish
      version:
        description: Version for set-live or set-beta (a rollback is set-live with an older version)
        required: false

permissions:
  contents: read

concurrency:
  group: dingn-games-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GAMES_BUCKET: dingn-193716-games
      FIREBASE_PROJECT_ID: dingn-193716
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Find changed games
        id: games
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_GAME: ${{ inputs.game }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            ids="$INPUT_GAME"
          else
            from="${BASE:-$BEFORE}"
            if [ "$EVENT" = push ] && git diff --quiet "$from" HEAD -- packages/game-sdk 2>/dev/null; then sdk=no; else sdk=yes; fi
            changed=$(git diff --name-only "$from" HEAD -- games | cut -d/ -f2 | sort -u)
            # A change to the SDK is checked against every game.
            [ "$sdk" = yes ] && changed=$(ls games)
            ids=$(for id in $changed; do [ -f "games/$id/game.json" ] && echo "$id"; done | tr '\n' ' ')
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Games: ${ids:-none}"
      - name: Build and check (no upload)
        if: github.event_name == 'pull_request'
        run: |
          for id in ${{ steps.games.outputs.ids }}; do
            GAMES_LOCAL_DIR="$RUNNER_TEMP/games" npm run publish:game -- "$id" --dry-run
          done
      - name: Authenticate with GitHub OIDC
        if: github.event_name != 'pull_request' && github.repository == 'ligangwang/dingn' && github.ref == 'refs/heads/main' && steps.games.outputs.ids != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: dingn-193716
          workload_identity_provider: projects/211238433635/locations/global/workloadIdentityPools/dingn-github/providers/github
          service_account: dingn-github-deploy@dingn-193716.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: github.event_name != 'pull_request' && github.repository == 'ligangwang/dingn' && github.ref == 'refs/heads/main' && steps.games.outputs.ids != ''
      - name: Publish
        if: github.event_name != 'pull_request' && github.repository == 'ligangwang/dingn' && github.ref == 'refs/heads/main' && steps.games.outputs.ids != ''
        env:
          ACTION: ${{ inputs.action || 'publish' }}
          VERSION: ${{ inputs.version }}
          IDS: ${{ steps.games.outputs.ids }}
        run: |
          for id in $IDS; do
            case "$ACTION" in
              publish) npm run publish:game -- "$id" --if-new ;;
              publish-beta) npm run publish:game -- "$id" --beta ;;
              set-live) npm run publish:game -- "$id" --set-live "$VERSION" ;;
              set-beta) npm run publish:game -- "$id" --set-beta "$VERSION" ;;
              list) npm run publish:game -- "$id" --listed ;;
              unlist) npm run publish:game -- "$id" --unlisted ;;
            esac
            printf -- '- `%s`: %s %s\n' "$id" "$ACTION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
